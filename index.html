<!DOCTYPE html>
<html class="h-full" lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Anónimo — Anonimizador de documentos</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="h-full flex flex-col bg-slate-50 text-slate-900 overflow-hidden">
  <div id="app" class="flex flex-col h-full">

    <!-- Cabecera -->
    <header id="header" class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0 z-20">
      <div id="header-left" class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold text-sm select-none">P</div>
          <h1 class="text-lg font-semibold tracking-tight text-slate-800">PDF Anónimo</h1>
        </div>
        <div class="h-6 w-px bg-slate-200 mx-1"></div>
        <span id="file-name" class="text-sm font-medium text-slate-500 truncate max-w-xs">Ningún documento cargado</span>
      </div>
      <div id="header-right" class="flex items-center gap-2">
        <button id="btn-metadata" class="btn px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-md transition-colors" disabled>
          Metadatos
        </button>
        <button id="btn-clear-meta" class="btn px-3 py-1.5 text-sm font-medium text-red-600 hover:bg-red-50 border border-transparent hover:border-red-100 rounded-md transition-colors" disabled>
          Borrar metadatos
        </button>
        <div class="h-6 w-px bg-slate-200 mx-1"></div>
        <button id="btn-save" class="btn px-4 py-1.5 text-sm font-semibold bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md transition-all shadow-sm" disabled>
          Guardar PDF
        </button>
        <button id="btn-save-open" class="btn px-4 py-1.5 text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700 rounded-md transition-all shadow-sm" disabled>
          Guardar y abrir
        </button>
      </div>
    </header>

    <!-- Zona de carga (drag & drop, visible cuando no hay docs) -->
    <div id="drop-zone" class="flex-1 flex items-center justify-center m-8 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer transition-all hover:border-blue-400 hover:bg-blue-50/20 min-h-64">
      <div id="drop-message" class="text-center text-slate-400 pointer-events-none">
        <svg class="w-16 h-16 mx-auto mb-4 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
        </svg>
        <p class="text-lg font-medium mb-1">Arrastra un PDF aquí</p>
        <p class="text-sm">o haz clic para abrir</p>
      </div>
    </div>

    <!-- Área de trabajo (visible tras cargar el primer PDF) -->
    <div id="workspace" class="flex flex-1 overflow-hidden" hidden>

      <!-- Sidebar de ficheros -->
      <aside id="sidebar" class="w-64 bg-slate-100 border-r border-slate-200 flex flex-col shrink-0">
        <div id="sidebar-header" class="p-4 border-b border-slate-200 bg-white/50 shrink-0">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Documentos</h2>
            <button id="btn-open" class="text-xs font-semibold text-blue-600 hover:underline">+ Abrir PDF</button>
            <input type="file" id="file-input" accept=".pdf" multiple hidden />
          </div>
        </div>
        <ul id="doc-list" class="overflow-y-auto flex-1 p-3 space-y-2"></ul>
      </aside>

      <!-- Área principal: toolbar + visor -->
      <div id="main-area" class="flex-1 flex flex-col min-w-0">

        <!-- Barra de herramientas -->
        <div id="toolbar" class="h-12 bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0">
          <div id="tool-buttons" class="flex items-center gap-1">
            <button id="tool-box" class="tool-btn flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-700 bg-slate-100 border border-slate-200 rounded-md hover:bg-slate-200 transition-colors" title="Redactar con caja negra">
              <span class="w-3 h-3 bg-slate-800 rounded-sm inline-block shrink-0"></span>
              Caja
            </button>
            <button id="tool-strike" class="tool-btn flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-red-700 hover:bg-red-50 border border-transparent hover:border-red-100 rounded-md transition-colors" title="Tachar texto">
              <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
              </svg>
              Tachar
            </button>
            <button id="tool-highlight" class="tool-btn flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-yellow-700 hover:bg-yellow-50 border border-transparent hover:border-yellow-100 rounded-md transition-colors" title="Resaltar texto (fosforescente)">
              <svg class="h-4 w-4 shrink-0" fill="currentColor" viewBox="0 0 24 24">
                <path d="M15.24 2h-4.48c-.53 0-1.04.21-1.41.59l-6.76 6.76a2 2 0 000 2.82l5.65 5.65c.39.39.9.59 1.41.59s1.02-.2 1.41-.59l6.76-6.76c.38-.37.59-.88.59-1.41v-4.48c0-1.1-.9-2-2-2zm-2.24 6c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
              </svg>
              Resaltar
            </button>
            <button id="tool-smear" class="tool-btn flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-purple-700 hover:bg-purple-50 border border-transparent hover:border-purple-100 rounded-md transition-colors" title="Emborronar (pixelar) texto">
              <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                <rect x="3" y="3" width="4" height="4" opacity="0.3"/><rect x="7" y="3" width="4" height="4" opacity="0.7"/><rect x="11" y="3" width="4" height="4" opacity="0.4"/><rect x="15" y="3" width="4" height="4" opacity="0.8"/>
                <rect x="3" y="7" width="4" height="4" opacity="0.8"/><rect x="7" y="7" width="4" height="4" opacity="0.3"/><rect x="11" y="7" width="4" height="4" opacity="0.9"/><rect x="15" y="7" width="4" height="4" opacity="0.5"/>
                <rect x="3" y="11" width="4" height="4" opacity="0.5"/><rect x="7" y="11" width="4" height="4" opacity="1"/><rect x="11" y="11" width="4" height="4" opacity="0.2"/><rect x="15" y="11" width="4" height="4" opacity="0.7"/>
                <rect x="3" y="15" width="4" height="4" opacity="0.9"/><rect x="7" y="15" width="4" height="4" opacity="0.4"/><rect x="11" y="15" width="4" height="4" opacity="0.6"/><rect x="15" y="15" width="4" height="4" opacity="0.3"/>
              </svg>
              Emborronar
            </button>
          </div>

          <div class="flex items-center gap-4">
            <!-- Navegación de páginas -->
            <div id="nav-buttons" class="flex items-center gap-2">
              <button id="btn-prev" class="p-1 text-slate-400 hover:text-slate-600 disabled:opacity-30 transition-colors" disabled>
                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                  <path clip-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" fill-rule="evenodd"/>
                </svg>
              </button>
              <span id="page-info" class="text-xs font-medium text-slate-600 whitespace-nowrap">Página 1 de 1</span>
              <button id="btn-next" class="p-1 text-slate-400 hover:text-slate-600 disabled:opacity-30 transition-colors" disabled>
                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                  <path clip-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" fill-rule="evenodd"/>
                </svg>
              </button>
            </div>
            <div class="h-6 w-px bg-slate-200"></div>
            <!-- Acciones de edición -->
            <div id="edit-buttons" class="flex items-center gap-2">
              <button id="btn-undo" class="flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-md transition-colors disabled:opacity-40" disabled>
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                Deshacer
              </button>
              <button id="btn-clear" class="px-3 py-1.5 text-sm font-medium text-slate-100 bg-slate-800 hover:bg-slate-900 rounded-md transition-colors">
                Limpiar página
              </button>
            </div>
          </div>
        </div>

        <!-- Visor de página -->
        <div id="canvas-container" class="flex-1 overflow-auto bg-neutral-600 p-8 flex justify-center items-start">
          <div id="canvas-wrapper" class="bg-white shadow-2xl relative">
            <canvas id="pdf-canvas" class="block"></canvas>
            <canvas id="redaction-canvas" class="absolute top-0 left-0 cursor-crosshair"></canvas>
          </div>
        </div>

        <!-- Footer de estado -->
        <footer id="status-bar" class="h-8 bg-white border-t border-slate-200 flex items-center justify-between px-4 text-xs text-slate-500 shrink-0">
          <div class="flex items-center gap-4">
            <span class="flex items-center gap-1.5">
              <span class="w-2 h-2 bg-green-500 rounded-full inline-block"></span>
              Listo para procesar
            </span>
            <span>Zoom: 100%</span>
          </div>
          <div class="flex items-center gap-4">
            <span>Resolución: 300 DPI</span>
            <span>Perfil: Anonimización Estándar</span>
          </div>
        </footer>

      </div>
    </div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
