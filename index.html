<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Anónimo — Anonimizador de documentos</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Cabecera -->
    <header id="header">
      <div id="header-left">
        <h1>PDF Anónimo</h1>
        <span id="file-name">Ningún documento cargado</span>
      </div>
      <div id="header-right">
        <button id="btn-clear-meta" class="btn btn-secondary" disabled title="Eliminar todos los metadatos sin abrir el panel">Borrar metadatos</button>
        <button id="btn-metadata" class="btn btn-secondary" disabled title="Ver y editar metadatos">Metadatos</button>
        <button id="btn-save" class="btn btn-success" disabled>Guardar PDF</button>
        <button id="btn-save-open" class="btn btn-success-outline" disabled>Guardar y abrir</button>
      </div>
    </header>

    <!-- Zona de carga (drag & drop, visible cuando no hay docs) -->
    <div id="drop-zone">
      <div id="drop-message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
        </svg>
        <p>Arrastra un PDF aquí</p>
        <p class="drop-sub">o haz clic para abrir</p>
      </div>
    </div>

    <!-- Área de trabajo (visible tras cargar el primer PDF) -->
    <div id="workspace" hidden>
      <!-- Sidebar de ficheros -->
      <aside id="sidebar">
        <div id="sidebar-header">
          <span>Documentos</span>
          <button id="btn-open" class="btn btn-primary btn-sm">+ Abrir PDF</button>
          <input type="file" id="file-input" accept=".pdf" multiple hidden />
        </div>
        <ul id="doc-list"></ul>
      </aside>

      <!-- Área principal: toolbar + visor -->
      <div id="main-area">
        <!-- Barra de herramientas -->
        <div id="toolbar">
          <div id="tool-buttons">
            <button id="tool-box" class="tool-btn active" title="Redactar con caja negra">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
              Caja
            </button>
            <button id="tool-strike" class="tool-btn" title="Tachar texto">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="12" x2="20" y2="12"/></svg>
              Tachar
            </button>
            <button id="tool-highlight" class="tool-btn" title="Resaltar texto (fosforecente)">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="11" width="18" height="8" rx="1" fill="#FFFF00" stroke="currentColor" stroke-width="0.5"/></svg>
              Resaltar
            </button>
          </div>

          <div id="nav-buttons">
            <button id="btn-prev" class="btn btn-secondary" disabled>‹ Anterior</button>
            <span id="page-info">Página 1 de 1</span>
            <button id="btn-next" class="btn btn-secondary" disabled>Siguiente ›</button>
          </div>

          <div id="edit-buttons">
            <button id="btn-undo" class="btn btn-secondary" disabled>↩ Deshacer</button>
            <button id="btn-clear" class="btn btn-danger">Limpiar página</button>
          </div>
        </div>

        <!-- Visor de página -->
        <div id="canvas-container">
          <div id="canvas-wrapper">
            <canvas id="pdf-canvas"></canvas>
            <canvas id="redaction-canvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
